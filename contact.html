<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1c2e3b;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contact-container {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .contact-info {
            flex: 1;
            min-width: 250px;
        }

        .contact-info h2 {
            color: #333;
            margin-top: 0;
        }

        .contact-info p {
            color: #666;
            line-height: 1.6;
        }

        .contact-form {
            flex: 1.5;
            min-width: 300px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }

        .form-group textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 600px) {
            .contact-container {
                padding: 20px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>

<div class="contact-container">
    <div class="contact-info">
        <h2>Get in Touch</h2>
        <p>Have questions? We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>

        <div style="margin-top: 20px;">
            <strong>Email:</strong><br>
            info@dayaengineering.com<br><br>
            <strong>Office:</strong><br>
            Zefco Building
            <br>
            Addis Ababa, Ethiopia<br>
            <strong>Phone:</strong><br> +251930098577<br> +251911604498
        </div>
    </div>
</div>

</body>
</html>
